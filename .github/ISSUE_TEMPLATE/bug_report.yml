name: Bug report
description: Something went wrong
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you got instead. Paste the output.
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: The command you ran
      placeholder: vatfa lecture.mp3 -f srt --max-cue-chars 42
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `vatfa --version`
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, Python, and device
      description: e.g. Ubuntu 24.04, Python 3.12, CUDA on an RTX 4060
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model
      placeholder: large-v3
  - type: textarea
    id: audio
    attributes:
      label: About the audio
      description: >
        Language, roughly how long, and where it came from. Please do not
        attach anything confidential.
