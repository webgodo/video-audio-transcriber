name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned so a new ruff release cannot turn CI red without a commit.
      # Keep in sync with the dev extra in pyproject.toml.
      - run: pip install ruff==0.16.7
      - run: ruff check --output-format=github .

  test:
    name: py${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # faster-whisper, ctranslate2, numpy and tqdm are all imported lazily
      # inside functions, so the unit tests and the CLI smoke test need neither
      # the heavy wheels nor a model download. Keep it that way: see
      # CONTRIBUTING.md.
      - run: pip install --no-deps -e . && pip install pytest
      - run: pytest -q
      # bash on every runner: PowerShell only propagates the last command's
      # exit code, which would swallow a failure in the first two lines.
      - name: CLI smoke test
        shell: bash
        run: |
          vatfa --version
          video-audio-transcriber --version
          vatfa --list-models
          vatfa --help

  install:
    name: dependency install (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # The only job that proves the real dependency set resolves. It still
      # downloads no model: importing faster_whisper does not fetch weights.
      - run: pip install -e ".[dev]"
      - run: python -c "import faster_whisper, ctranslate2, tqdm; print(ctranslate2.__version__)"
      - run: pytest -q
