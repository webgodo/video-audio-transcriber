[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-audio-transcriber"
dynamic = ["version"]
description = "Offline audio and video transcription CLI built on OpenAI Whisper, with first-class Persian (Farsi) text handling"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["whisper", "persian", "farsi", "transcription", "speech-to-text", "subtitles"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Persian",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "faster-whisper>=1.1",
    "ctranslate2>=4.8.2",
    "tqdm>=4.60",
]

[project.optional-dependencies]
# NVIDIA cuBLAS for GPU inference, installed via pip so no system-wide CUDA
# install is needed (CTranslate2 >= 4.8.2 no longer needs cuDNN).
cuda = ["nvidia-cublas-cu12"]
dev = ["pytest", "ruff==0.16.7"]

[project.urls]
Homepage = "https://github.com/webgodo/video-audio-transcriber"
Repository = "https://github.com/webgodo/video-audio-transcriber"
Issues = "https://github.com/webgodo/video-audio-transcriber/issues"

[project.scripts]
video-audio-transcriber = "video_audio_transcriber.cli:main"
vatfa = "video_audio_transcriber.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "video_audio_transcriber.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
